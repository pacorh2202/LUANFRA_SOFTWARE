[project]
name = "luanfra-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "python-dateutil>=2.9",
  "python-multipart>=0.0.18",
]

[project.optional-dependencies]
geometria = ["cadquery-ocp==7.8.1.1.post1"]
lectores = ["werk24==2.6.0", "pypdf>=6.0,<7"]
ia = ["anthropic>=0.40"]
importacion = ["pandas>=2.2", "openpyxl>=3.1"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
