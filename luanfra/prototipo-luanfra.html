<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luanfra — Prototipo del sistema de ofertas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#14171A; --tinta-suave:#3A4149; --tinta-tenue:#6B7280;
  --marca:#D42A2A; --marca-oscuro:#A81F1F; --marca-claro:#FDECEC;
  --lienzo:#F6F7F9; --card:#FFFFFF;
  --borde:#E6E8EB; --borde-fuerte:#D3D7DC;
  --exito:#16A34A; --exito-claro:#ECFDF3;
  --aviso:#B45309; --aviso-claro:#FEF6E7;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,"Segoe UI",sans-serif;background:var(--lienzo);color:var(--tinta);
     -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
.cifra{font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:inherit}
table{width:100%;border-collapse:collapse}

/* --- estructura --- */
.app{display:flex;min-height:100vh}
.lateral{width:56px;background:#fff;border-right:1px solid var(--borde);display:flex;
         flex-direction:column;align-items:center;padding:12px 0;gap:4px;position:sticky;top:0;height:100vh}
.logo{width:32px;height:32px;border-radius:8px;background:var(--tinta);display:grid;place-items:center;
      color:var(--marca);font-weight:600;margin-bottom:10px}
.nav{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--tinta-tenue);
     transition:.15s;font-size:17px}
.nav:hover{background:var(--lienzo);color:var(--tinta)}
.nav.activo{background:var(--marca-claro);color:var(--marca)}
.principal{flex:1;min-width:0;padding-bottom:60px}

.cabecera{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 24px 16px;gap:20px}
.cabecera h1{font-size:20px;font-weight:600}
.cabecera p{font-size:14px;color:var(--tinta-tenue);margin-top:2px}

/* --- piezas --- */
.card{background:var(--card);border:1px solid var(--borde);border-radius:var(--r)}
.card>header{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:48px;
             border-bottom:1px solid var(--borde)}
.card>header h2{font-size:14px;font-weight:600}
.etiqueta{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--tinta-tenue)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:0 24px}
.kpi{background:#fff;border:1px solid var(--borde);border-radius:var(--r);padding:16px}
.kpi .valor{font-size:24px;font-weight:600;margin-top:6px}
.kpi .valor.acento{color:var(--marca)}
.kpi .pie{font-size:12px;color:var(--tinta-tenue);margin-top:2px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;
      font-size:12px;font-weight:500;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor;opacity:.7}
.chip.sinpunto::before{display:none}
.chip.verde{background:var(--exito-claro);color:var(--exito)}
.chip.ambar{background:var(--aviso-claro);color:var(--aviso)}
.chip.rojo{background:var(--marca-claro);color:var(--marca)}
.chip.gris{background:var(--lienzo);color:var(--tinta-tenue);border:1px solid var(--borde)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;height:36px;
     border-radius:8px;font-weight:500;transition:.15s}
.btn-prim{background:var(--tinta);color:#fff}
.btn-prim:hover{background:var(--tinta-suave)}
.btn-sec{background:#fff;border:1px solid var(--borde);color:var(--tinta)}
.btn-sec:hover{background:var(--lienzo)}
.btn-marca{background:var(--marca);color:#fff}
.btn-marca:hover{background:var(--marca-oscuro)}
.btn:disabled{opacity:.4;cursor:not-allowed}

.filtro{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--borde);background:#fff;
        color:var(--tinta-suave);font-weight:500;font-size:13px;transition:.15s}
.filtro:hover{background:var(--lienzo)}
.filtro.activo{background:var(--tinta);color:#fff;border-color:var(--tinta)}

.campo{height:36px;padding:0 12px;border:1px solid var(--borde);border-radius:8px;background:#fff;width:100%}
.campo:focus{outline:none;border-color:var(--borde-fuerte);box-shadow:0 0 0 3px rgba(20,23,26,.06)}

thead th{text-align:left;font-weight:500;color:var(--tinta-tenue);padding:10px 16px;font-size:13px;
         border-bottom:1px solid var(--borde)}
tbody td{padding:12px 16px;border-bottom:1px solid var(--borde)}
tbody tr:last-child td{border-bottom:none}
tr.pulsable{cursor:pointer;transition:background .12s}
tr.pulsable:hover{background:var(--lienzo)}
.der{text-align:right}
.sub{font-size:12px;color:var(--tinta-tenue)}

.barra{height:6px;background:var(--lienzo);border-radius:99px;overflow:hidden}
.barra>span{display:block;height:100%;border-radius:99px;transition:width .3s}

.aviso{display:flex;gap:10px;padding:12px;border-radius:8px;font-size:13px;line-height:1.55}
.aviso.bloqueante{background:var(--marca-claro);color:var(--marca-oscuro)}
.aviso.importante{background:var(--aviso-claro);color:var(--aviso)}
.aviso.menor{background:var(--lienzo);color:var(--tinta-tenue)}
.aviso .ic{flex-shrink:0;font-weight:600}

.rejilla{display:grid;grid-template-columns:1fr 360px;gap:16px;padding:16px 24px;align-items:start}
.pila{display:flex;flex-direction:column;gap:16px}
.fila{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:14px;padding:3px 0}
.fila .k{color:var(--tinta-tenue)}
.vacio{padding:48px 16px;text-align:center;color:var(--tinta-tenue)}
.vacio strong{display:block;color:var(--tinta);font-size:14px;margin-bottom:4px}
.brindis{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:99px;
         font-size:13px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.14);opacity:0;transition:.25s;
         pointer-events:none;z-index:50}
.brindis.ver{opacity:1;transform:translateX(-50%) translateY(-4px)}
.brindis.ok{background:var(--exito);color:#fff}
.brindis.mal{background:var(--marca);color:#fff}
.nota{font-size:12px;color:var(--tinta-tenue);line-height:1.6}
.demo{background:#FFF8E6;border-bottom:1px solid #F0DFB0;color:#7A5B10;font-size:12.5px;
      padding:8px 24px;text-align:center}

.bloque{background:#fff;border:1px solid var(--borde);border-radius:var(--r);
  overflow:hidden;margin-bottom:16px}
.bloque>h3{font-size:14px;font-weight:600;padding:12px 16px;
  border-bottom:1px solid var(--borde);display:flex;justify-content:space-between;
  align-items:center}
.bloque>h3 span{font-size:12px;font-weight:400;color:var(--tinta-tenue)}
.ind{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:11px 16px;border-bottom:1px solid #f0f1f3}
.ind:last-child{border-bottom:none}
.ind .n{font-weight:500}
.ind .f{font-size:12px;color:var(--tinta-tenue);margin-top:1px}
.ind .v{text-align:right;flex-shrink:0}
.ind .v b{font-size:17px;font-variant-numeric:tabular-nums}
.ind .v small{display:block;font-size:11px;color:var(--tinta-tenue)}
.punto{width:8px;height:8px;border-radius:99px;flex-shrink:0}
.p-bien{background:var(--exito)}.p-regular{background:var(--aviso)}
.p-mal{background:var(--marca)}.p-sin{background:var(--borde-fuerte)}
.p-informativo{background:var(--tinta-tenue)}
.aviso-c{background:#fff;border:1px solid var(--borde);border-radius:var(--r);
  padding:14px 16px;margin-bottom:10px;display:flex;gap:12px}
.aviso-c.critica{border-left:3px solid var(--marca)}
.aviso-c.alta{border-left:3px solid var(--aviso)}
.aviso-c.media{border-left:3px solid var(--tinta-tenue)}
.aviso-c .cuerpo{flex:1;min-width:0}
.aviso-c .t{font-weight:600;margin-bottom:3px}
.aviso-c .d{font-size:13px;color:var(--tinta-tenue);line-height:1.55}
.aviso-c .a{font-size:13px;margin-top:8px;font-weight:500}
.drop{border:2px dashed var(--borde-fuerte);border-radius:10px;padding:22px;
  text-align:center;color:var(--tinta-tenue);transition:.15s;cursor:pointer;background:#fff}
.drop:hover,.drop.sobre{border-color:var(--marca);background:var(--marca-claro);
  color:var(--marca)}
.fich{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;
  border:1px solid var(--borde);border-radius:9px;margin-top:9px;background:#fff}
.fich .ico{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.fich .ico.pdf{background:var(--marca)}.fich .ico.d3{background:var(--tinta)}
.fich .ico.err{background:var(--tinta-tenue)}
.mq{cursor:pointer}
.mq:hover polygon{filter:brightness(1.12)}
.leyenda{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--tinta-suave)}
.leyenda .lg{display:flex;align-items:center;gap:6px}
.leyenda i{width:11px;height:11px;border-radius:3px;display:block}
code{background:var(--lienzo);padding:1px 5px;border-radius:4px;font-size:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.tarjeta{background:#fff;border:1px solid var(--borde);border-radius:var(--r);padding:16px}
.tarjeta h3{font-size:14px;font-weight:600;margin-bottom:2px}
.tarjeta .sub2{font-size:12px;color:var(--tinta-tenue);margin-bottom:14px}
.hero{background:var(--tinta);color:#fff;border-radius:var(--r);padding:20px 22px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px}
.hero .e{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.6;
  font-weight:600}
.hero .v{font-size:27px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums}
.hero .v.r{color:#FF7A6B}
.hero .p{font-size:12px;opacity:.6;margin-top:2px}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}
.chat{background:#fff;border:1px solid var(--borde);border-radius:var(--r);
  height:460px;display:flex;flex-direction:column;overflow:hidden}
.chat .msgs{flex:1;overflow-y:auto;padding:16px;display:flex;
  flex-direction:column;gap:12px}
.burb{max-width:76%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.55}
.burb.yo{align-self:flex-end;background:var(--tinta);color:#fff}
.burb.bot{align-self:flex-start;background:var(--lienzo);border:1px solid var(--borde)}
.burb .fuente{font-size:11px;margin-top:7px;padding-top:6px;
  border-top:1px solid var(--borde);color:var(--tinta-tenue)}
.burb.bot .fuente.tec{color:var(--aviso)}
.chat .entrada{border-top:1px solid var(--borde);padding:12px;display:flex;gap:8px}
.sug{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sug button{font-size:12px;padding:5px 11px;border-radius:99px;
  border:1px solid var(--borde);background:#fff;color:var(--tinta-suave)}
.sug button:hover{background:var(--lienzo)}
@media(max-width:1000px){.rejilla{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

const PAL = {tinta:"#14171A", marca:"#D42A2A", acero:"#6B7280",
             exito:"#16A34A", aviso:"#B45309", suave:"#E6E8EB"};

function svg(w, h, contenido, extra="") {
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"
    preserveAspectRatio="xMidYMid meet" ${extra}
    style="display:block;overflow:visible">${contenido}</svg>`;
}

/** Línea con área bajo la curva. Para series temporales. */
function gLinea(datos, {alto=180, color=PAL.marca, sufijo="", minCero=false}={}) {
  if (!datos.length) return "";
  const w = 620, h = alto, mx = 42, my = 18;
  const vals = datos.map(d => d.v);
  const max = Math.max(...vals) * 1.1;
  const min = minCero ? 0 : Math.max(0, Math.min(...vals) * 0.85);
  const ex = i => mx + i * (w - mx - 14) / Math.max(1, datos.length - 1);
  const ey = v => my + (1 - (v - min) / (max - min || 1)) * (h - my * 2);

  const puntos = datos.map((d, i) => `${ex(i)},${ey(d.v)}`).join(" ");
  const area = `M${ex(0)},${h - my} L${puntos.split(" ").join(" L")} L${ex(datos.length-1)},${h - my} Z`;

  const rejilla = [0, .5, 1].map(f => {
    const v = min + (max - min) * f, y = ey(v);
    return `<line x1="${mx}" y1="${y}" x2="${w-14}" y2="${y}" stroke="${PAL.suave}" stroke-width="1"/>
            <text x="${mx-8}" y="${y+4}" text-anchor="end" font-size="11"
              fill="${PAL.acero}">${Math.round(v)}${sufijo}</text>`;
  }).join("");

  const etiquetas = datos.map((d, i) =>
    (datos.length <= 12 || i % 2 === 0)
      ? `<text x="${ex(i)}" y="${h-2}" text-anchor="middle" font-size="11"
           fill="${PAL.acero}">${d.e}</text>` : "").join("");

  const marcas = datos.map((d, i) =>
    `<circle cx="${ex(i)}" cy="${ey(d.v)}" r="3.5" fill="#fff" stroke="${color}"
       stroke-width="2"><title>${d.e}: ${d.v}${sufijo}</title></circle>`).join("");

  return svg(w, h, `${rejilla}
    <path d="${area}" fill="${color}" opacity="0.07"/>
    <polyline points="${puntos}" fill="none" stroke="${color}" stroke-width="2.5"
      stroke-linejoin="round" stroke-linecap="round"/>
    ${marcas}${etiquetas}`);
}

/** Barras verticales. */
function gBarras(datos, {alto=180, color=PAL.tinta, formato=v=>v}={}) {
  if (!datos.length) return "";
  const w = 620, h = alto, mx = 46, my = 16;
  const max = Math.max(...datos.map(d => d.v)) * 1.12 || 1;
  const ancho = (w - mx - 14) / datos.length;
  const bw = Math.min(38, ancho * 0.62);

  const rejilla = [0, .5, 1].map(f => {
    const v = max * f, y = my + (1 - f) * (h - my * 2);
    return `<line x1="${mx}" y1="${y}" x2="${w-14}" y2="${y}" stroke="${PAL.suave}"/>
            <text x="${mx-8}" y="${y+4}" text-anchor="end" font-size="11"
              fill="${PAL.acero}">${formato(Math.round(v))}</text>`;
  }).join("");

  const barras = datos.map((d, i) => {
    const x = mx + i * ancho + (ancho - bw) / 2;
    const alt = (d.v / max) * (h - my * 2);
    const y = h - my - alt;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(1,alt)}" rx="3"
      fill="${d.color || color}"><title>${d.e}: ${formato(d.v)}</title></rect>
      <text x="${x + bw/2}" y="${h-2}" text-anchor="middle" font-size="11"
        fill="${PAL.acero}">${d.e}</text>`;
  }).join("");

  return svg(w, h, rejilla + barras);
}

/** Barras horizontales, para rankings con nombres largos. */
function gBarrasH(datos, {color=PAL.tinta, formato=v=>v}={}) {
  if (!datos.length) return "";
  const w = 620, fila = 30, h = datos.length * fila + 8;
  const mx = 190;
  const max = Math.max(...datos.map(d => d.v)) || 1;

  return svg(w, h, datos.map((d, i) => {
    const y = i * fila + 6;
    const ancho = (d.v / max) * (w - mx - 76);
    return `<text x="${mx-10}" y="${y+14}" text-anchor="end" font-size="12"
        fill="${PAL.tinta}">${esc(d.e.length>26 ? d.e.slice(0,25)+"…" : d.e)}</text>
      <rect x="${mx}" y="${y+3}" width="${Math.max(2,ancho)}" height="16" rx="3"
        fill="${d.color || color}"><title>${esc(d.e)}: ${formato(d.v)}</title></rect>
      <text x="${mx + ancho + 8}" y="${y+16}" font-size="12" fill="${PAL.acero}"
        >${formato(d.v)}</text>`;
  }).join(""));
}

/** Rosco, para composiciones. */
function gDonut(segmentos, {alto=190, centro=""}={}) {
  const total = segmentos.reduce((s, x) => s + x.v, 0) || 1;
  const w = 620, h = alto, cx = 95, cy = h/2, r = 70, gr = 22;
  let angulo = -Math.PI / 2;

  const arcos = segmentos.map(s => {
    const barrido = (s.v / total) * Math.PI * 2;
    const fin = angulo + barrido;
    const grande = barrido > Math.PI ? 1 : 0;
    const p = (rad, a) => `${cx + rad*Math.cos(a)},${cy + rad*Math.sin(a)}`;
    const d = `M${p(r,angulo)} A${r},${r} 0 ${grande} 1 ${p(r,fin)}
               L${p(r-gr,fin)} A${r-gr},${r-gr} 0 ${grande} 0 ${p(r-gr,angulo)} Z`;
    angulo = fin;
    return `<path d="${d}" fill="${s.color}"><title>${esc(s.e)}: ${
      Math.round(s.v/total*100)}%</title></path>`;
  }).join("");

  const leyenda = segmentos.map((s, i) => `
    <rect x="205" y="${h/2 - segmentos.length*13 + i*26 + 2}" width="10" height="10"
      rx="2" fill="${s.color}"/>
    <text x="222" y="${h/2 - segmentos.length*13 + i*26 + 11}" font-size="12.5"
      fill="${PAL.tinta}">${esc(s.e)}</text>
    <text x="600" y="${h/2 - segmentos.length*13 + i*26 + 11}" font-size="12.5"
      text-anchor="end" fill="${PAL.acero}">${Math.round(s.v/total*100)}%</text>`).join("");

  const texto = centro ? `<text x="${cx}" y="${cy-2}" text-anchor="middle"
      font-size="19" font-weight="600" fill="${PAL.tinta}">${centro}</text>
    <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="11"
      fill="${PAL.acero}">del total</text>` : "";

  return svg(w, h, arcos + texto + leyenda);
}

/** Miniatura de tendencia, para meter dentro de un KPI. */
function chispa(valores, color=PAL.marca) {
  if (valores.length < 2) return "";
  const w = 90, h = 26;
  const max = Math.max(...valores), min = Math.min(...valores);
  const puntos = valores.map((v, i) =>
    `${i*(w/(valores.length-1))},${h - 3 - ((v-min)/((max-min)||1))*(h-6)}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"
    style="display:block;margin-top:6px"><polyline points="${puntos}" fill="none"
    stroke="${color}" stroke-width="2" stroke-linejoin="round"/></svg>`;
}

/** Barra de progreso hacia un objetivo. */
function gMeta(valor, objetivo, sentido) {
  const pct = sentido === "mayor"
    ? Math.min(100, valor / objetivo * 100)
    : Math.min(100, objetivo / Math.max(valor, 0.01) * 100);
  const color = pct >= 100 ? PAL.exito : pct >= 80 ? PAL.aviso : PAL.marca;
  return `<div class="barra" style="margin-top:8px">
    <span style="width:${pct}%;background:${color}"></span></div>`;
}

function vistaOfertas() {
  const q = busqueda.trim().toLowerCase();
  const lista = OFERTAS.filter(o =>
    o.estado === "borrador" &&
    (!filtroVia || o.via === filtroVia) &&
    (!q || (cliente(o.cliente).nombre + " " + o.ref + " " + o.desc).toLowerCase().includes(q)));

  const botones = [[null,"Todas"],["A","Ya la hicimos"],["B","Parecidas"],["C","Necesitan persona"]];

  return `
  <div class="cabecera">
    <div><h1>Ofertas</h1><p>Propuestas pendientes de tu revisión</p></div>
    <input class="campo" style="width:260px" id="buscador" placeholder="Cliente o referencia…"
           value="${esc(busqueda)}" oninput="busqueda=this.value;pintar();document.getElementById('buscador').focus()">
  </div>
  <div style="padding:0 24px;display:flex;gap:8px">
    ${botones.map(([v,t]) => `<button class="filtro ${filtroVia===v?"activo":""}"

  </div>
  <div style="padding:16px 24px">
    <section class="card">
      ${lista.length === 0 ? `<div class="vacio"><strong>Nada pendiente por aquí</strong>
          Cuando entre una petición nueva aparecerá en esta lista.</div>` : `
      <table>
        <thead><tr>
          <th>Cliente</th><th>Pieza</th><th>Vía</th>
          <th class="der">Precio</th><th class="der">Confianza</th><th class="der">Entrega</th>
        </tr></thead>
        <tbody>
        ${lista.map(o => `
          <tr class="pulsable" onclick="irA('ficha',${o.id})">
            <td><div style="font-weight:500">${esc(cliente(o.cliente).nombre)}</div>
                <div class="sub">${o.cantidad} ud</div></td>
            <td><div>${esc(o.ref)}</div><div class="sub">${esc(o.desc)}</div></td>
            <td>${chipVia(o.via)} ${bloqueantes(o)?'<span style="color:var(--marca)">⚠</span>':""}</td>
            <td class="der cifra" style="font-weight:500">
              ${o.precio ? eur(o.precio) : '<span style="color:var(--tinta-tenue);font-weight:400">sin precio</span>'}</td>
            <td class="der cifra sub">${pc(o.confianza)}</td>
            <td class="der cifra sub">${fechaCorta(o.comprometible)}</td>
          </tr>`).join("")}
        </tbody>
      </table>`}
    </section>
    <p class="nota" style="margin-top:12px">${lista.length} oferta${lista.length===1?"":"s"} en borrador.
       Ninguna se ha enviado a nadie.</p>
  </div>`;
}

function vistaFicha(id) {
  const o = OFERTAS.find(x => x.id === id);
  if (!o) return `<div class="vacio"><strong>Oferta no encontrada</strong></div>`;
  const c = cliente(o.cliente);
  const sinPrecio = o.precio == null;
  const conf = Math.round(o.confianza * 100);
  const d = o.desglose || {};
  const margen = o.precio && o.coste ? Math.round((o.precio - o.coste) / o.coste * 100) : null;
  const textoConf = conf > 80 ? "Pieza conocida y comparables sólidos. Puedes fiarte del número."
    : conf > 55 ? "Hay comparables, pero no exactos. Merece un vistazo al desglose."
    : "Poco apoyo en el histórico. Esta la tienes que valorar tú.";

  return `
  <header style="padding:20px 24px 16px;border-bottom:1px solid var(--borde);background:#fff">
    <button class="sub" style="margin-bottom:10px" onclick="irA('ofertas')">← Ofertas</button>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:24px">
      <div style="min-width:0">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <h1 style="font-size:20px;font-weight:600">${esc(c.nombre)}</h1>
          ${chipVia(o.via)}
          <span class="chip gris sinpunto">${o.estado}</span>
        </div>
        <p class="sub" style="margin-top:4px;font-size:14px">
          ${esc(o.ref)} · ${esc(o.desc)} · ${o.cantidad} unidades</p>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div class="etiqueta">Precio propuesto</div>
        <div class="cifra" style="font-size:30px;font-weight:600;margin-top:2px">
          ${sinPrecio ? '<span style="font-size:20px;color:var(--tinta-tenue)">Sin precio</span>' : eur(o.precio)}</div>
        ${sinPrecio ? "" : `<div class="sub cifra">Banda ${eur(o.min)} — ${eur(o.max)}</div>`}
      </div>
    </div>
  </header>

  <div class="rejilla">
    <div class="pila">
      ${sinPrecio ? `<section class="card"><div style="padding:16px">
        <div class="aviso bloqueante"><span class="ic">!</span><span>
          <strong>No propongo precio para esta pieza.</strong> Es nueva o el plano tiene carencias
          que impiden calcular con honestidad. Abajo tienes el expediente y las preguntas para el cliente.
        </span></div></div></section>` : ""}

      ${sinPrecio ? "" : `
      <section class="card">
        <header><h2>Desglose del coste</h2><span class="sub">modelo 2026.09-a</span></header>
        <div style="padding:16px">
          <div class="fila"><span class="k">Material</span><span class="cifra">${eur(d.material)}</span></div>
          <div class="fila"><span class="k">Máquina</span><span class="cifra">${eur(d.maquina)}</span></div>
          <div class="fila"><span class="k">Preparación</span><span class="cifra">${eur(d.preparacion)}</span></div>
          <div class="fila"><span class="k">Subcontratas</span><span class="cifra">${eur(d.externo)}</span></div>
          <div class="fila"><span class="k">Indirectos</span><span class="cifra">${eur(d.indirectos)}</span></div>
          <div style="border-top:1px solid var(--borde);margin-top:10px;padding-top:10px">
            <div class="fila"><span class="k">Coste total</span>
              <span class="cifra" style="font-weight:600">${eur(o.coste)}</span></div>
            <div class="fila"><span class="k">Margen sobre coste</span>
              <span class="cifra" style="font-weight:600">${margen} %</span></div>
            <div class="fila"><span class="k">Carga de máquina</span>
              <span class="cifra sub">${horas(o.minutos)}</span></div>
          </div>
        </div>
      </section>`}

      <section class="card">
        <header><h2>Piezas en las que me apoyo</h2>
          <span class="sub">${o.comparables.length} comparables</span></header>
        ${o.comparables.length === 0 ? `<div class="vacio"><strong>Sin comparables</strong>
            No he encontrado piezas parecidas en el histórico.</div>` : `
        <table>
          <thead><tr><th>Pieza</th><th class="der">Parecido</th>
            <th class="der">Se ofertó</th><th class="der">Horas reales</th><th class="der">Resultado</th></tr></thead>
          <tbody>
          ${o.comparables.map(x => `
            <tr>
              <td><div style="font-weight:500">${esc(x.ref)}</div>
                  <div class="sub">${esc(x.desc)} · ${x.cuando}</div></td>
              <td class="der">
                <div style="display:flex;align-items:center;justify-content:flex-end;gap:8px">
                  <div class="barra" style="width:56px"><span style="width:${x.sim*100}%;background:var(--tinta-suave)"></span></div>
                  <span class="cifra sub" style="width:34px">${pc(x.sim)}</span></div></td>
              <td class="der cifra">${eur(x.precio)}</td>
              <td class="der cifra sub">${horas(x.min)}</td>
              <td class="der"><span class="chip ${x.res==="ganada"?"verde":"rojo"}">${x.res}</span></td>
            </tr>`).join("")}
          </tbody>
        </table>`}
      </section>

      <section class="card">
        <header><h2>Revisión del plano</h2><span class="sub">${esc(o.plano)}</span></header>
        <div style="padding:16px;display:flex;flex-direction:column;gap:8px">
          ${o.hallazgos.length === 0 ? `<div class="aviso menor"><span class="ic">i</span>
              <span>No he encontrado problemas en los catorce puntos que reviso.
              Eso no certifica que el plano esté completo.</span></div>`
            : o.hallazgos.map(h => `<div class="aviso ${HALLAZGOS[h].g}">
                <span class="ic">${HALLAZGOS[h].g==="menor"?"i":"!"}</span>
                <span>${HALLAZGOS[h].t}</span></div>`).join("")}
          <div class="nota" style="display:flex;gap:16px;padding-top:4px">
            <span>Método: ${o.vectorial ? "texto vectorial" : "visión (plano escaneado)"}</span>
            <span>Fiabilidad de la lectura: ${pc(o.fiabilidad)}</span>
          </div>
        </div>
      </section>

      ${o.hipotesis.length === 0 ? "" : `
      <section class="card">
        <header><h2>Hipótesis asumidas</h2></header>
        <div style="padding:16px">
          ${o.hipotesis.map(h => `<div style="padding:2px 0">· ${esc(h)}</div>`).join("")}
          <p class="nota" style="margin-top:10px">Van escritas en la oferta.
             Si el cliente difiere, se revisa el precio.</p>
        </div>
      </section>`}

      ${o.correcciones.length === 0 ? "" : `
      <section class="card">
        <header><h2>Correcciones que hiciste</h2></header>
        <div>
          ${o.correcciones.map(x => `
            <div style="padding:12px 16px;border-bottom:1px solid var(--borde);
                        display:flex;justify-content:space-between;gap:16px">
              <div><div style="font-weight:500">precio propuesto</div>
                   ${x.motivo ? `<div class="sub">${esc(x.motivo)}</div>` : ""}</div>
              <div class="cifra der" style="flex-shrink:0">
                <span class="sub" style="text-decoration:line-through">${eur(x.antes)}</span>
                <span class="sub" style="margin:0 8px">→</span>
                <span style="font-weight:600">${eur(x.despues)}</span></div>
            </div>`).join("")}
        </div>
      </section>`}
    </div>

    <div class="pila">
      <section class="card">
        <header><h2>Confianza</h2></header>
        <div style="padding:16px">
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
            <span class="cifra" style="font-size:24px;font-weight:600">${conf} %</span>
            ${chipVia(o.via)}
          </div>
          <div class="barra"><span style="width:${conf}%;background:${tonoBarra(conf)}"></span></div>
          <p class="nota" style="margin-top:12px">${textoConf}</p>
        </div>
      </section>

      <section class="card">
        <header><h2>Plazo de entrega</h2></header>
        <div style="padding:16px">
          <div class="fila"><span class="k">Óptimo</span><span class="cifra sub">${fecha(o.optimo)}</span></div>
          <div class="fila"><span class="k">Comprometible</span>
            <span class="cifra" style="font-weight:600">${fecha(o.comprometible)}</span></div>
          <p class="nota" style="margin-top:10px">Al cliente se le da la fecha comprometible:
             es la que se cumple ocho de cada diez veces.</p>
        </div>
      </section>

      <section class="card">
        <header><h2>Petición original</h2></header>
        <div style="padding:16px">
          <div class="fila"><span class="k">De</span><span>${esc(o.remitente)}</span></div>
          <div class="fila"><span class="k">Recibida</span><span class="cifra">${fecha(o.recibida)}</span></div>
          <p class="nota" style="margin-top:8px">✉ ${esc(o.asunto)}</p>
        </div>
      </section>

      ${o.estado !== "borrador" ? `
        <div class="card" style="padding:16px">
          <p class="nota">Esta oferta ya está <strong>${o.estado}</strong>.
             Cualquier cambio a partir de aquí queda registrado en la auditoría.</p>
        </div>` : `
        <div style="display:flex;gap:8px">
          <button class="btn btn-prim" style="flex:1" ${sinPrecio?"disabled":""}
                  onclick="aprobar(${o.id})">✓ Aprobar</button>
          <button class="btn btn-sec" onclick="alternarCorreccion()">✎ Corregir</button>
        </div>
        <div id="formCorreccion" style="display:none">
          <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px">
            <div>
              <label class="etiqueta">Precio corregido</label>
              <input class="campo cifra" style="margin-top:6px" type="number" step="0.01"
                     id="nuevoPrecio" value="${o.precio ?? ""}" oninput="validarPrecio(${o.id})">
              <p class="nota" id="errPrecio" style="color:var(--marca);display:none;margin-top:4px"></p>
            </div>
            <div>
              <label class="etiqueta">Por qué lo cambias</label>
              <input class="campo" style="margin-top:6px" id="motivo" placeholder="Cliente habitual, pieza urgente…">
              <p class="nota" style="margin-top:4px">Esto es lo que enseña al sistema tu criterio. Merece una línea.</p>
            </div>
            <button class="btn btn-marca" id="btnGuardar" onclick="corregir(${o.id})">Guardar corrección</button>
          </div>
        </div>
        <button class="btn btn-sec" style="width:100%;color:var(--tinta-tenue)"
                onclick="descartar(${o.id})">✕ Descartar</button>
        <p class="nota" style="text-align:center">Aprobar no envía nada. El correo al cliente lo mandas tú.</p>`}
    </div>
  </div>`;
}

  <div style="padding:16px 24px">

function vistaTaller() {
  return `
  <div class="cabecera"><div><h1>Taller</h1>
    <p>Carga real por centro de trabajo y simulador de capacidad</p></div></div>
  <div style="padding:0 24px 16px">
    <section class="card">
      <header><h2>Capacidad y cola actual</h2></header>
      <table>
        <thead><tr><th>Centro</th><th class="der">Turnos</th><th class="der">Disponibilidad</th>
          <th class="der">Cola</th><th class="der">Se libera en</th><th class="der">Tarifa</th></tr></thead>
        <tbody>
        ${CENTROS.map(c => {
          if (c.externo) return `<tr><td style="font-weight:500">${c.cod}
              <div class="sub">${c.nombre}</div></td>
            <td class="der sub">—</td><td class="der sub">—</td><td class="der sub">—</td>
            <td class="der cifra">${c.externo} días</td><td class="der sub">subcontrata</td></tr>`;
          const dl = c.cola / (c.horas*60*c.factor);
          return `<tr>
            <td style="font-weight:500">${c.cod}<div class="sub">${c.nombre}</div></td>
            <td class="der cifra">${(c.horas/8).toFixed(0)}</td>
            <td class="der cifra ${c.factor<0.68?"":""}">${Math.round(c.factor*100)} %</td>
            <td class="der cifra">${horas(c.cola)}</td>
            <td class="der cifra" style="font-weight:500">${dl.toFixed(1)} días</td>
            <td class="der cifra sub">${c.tarifa.toFixed(2)} €/min</td>
          </tr>`;
        }).join("")}
        </tbody>
      </table>
    </section>
    <p class="nota" style="margin-top:12px">La disponibilidad sale del histórico de partes, no del horario teórico.
       Es la variable que más afecta a los plazos.</p>
  </div>

  <div style="padding:0 24px">
    <section class="card">
      <header><h2>Simulador: ¿y si entra este pedido?</h2></header>
      <div style="padding:16px">
        <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
          <div><label class="etiqueta">Centro</label>
            <select class="campo" style="width:180px;margin-top:6px" id="simCentro" onchange="simular()">
              ${CENTROS.filter(c=>!c.externo).map(c=>`<option value="${c.cod}">${c.cod}</option>`).join("")}
            </select></div>
          <div><label class="etiqueta">Piezas</label>
            <input class="campo cifra" style="width:110px;margin-top:6px" type="number" min="1"
                   id="simCantidad" value="300" oninput="simular()"></div>
          <div><label class="etiqueta">Minutos por pieza</label>
            <input class="campo cifra" style="width:130px;margin-top:6px" type="number" min="1"
                   id="simMinutos" value="7" oninput="simular()"></div>

/* ============================================================
   LECTURA DE FICHEROS EN EL NAVEGADOR
   Sin librerías. El PDF se descomprime con DecompressionStream, que traen
   Chrome, Edge y Firefox modernos. El STEP es texto plano.
   ============================================================ */

async function inflar(bytes){
  /*
    Los flujos de un PDF van comprimidos con deflate y el navegador sabe
    descomprimirlos. Se construye el ReadableStream a mano en vez de usar
    Blob.stream(): hay entornos donde ese método no existe y entonces la
    lectura fallaba en silencio, que es lo peor que puede pasar aquí.
  */
  if (typeof DecompressionStream === "undefined") return null;
  for (const fmt of ["deflate", "deflate-raw"]) {
    try {
      const entrada = new ReadableStream({
        start(c){ c.enqueue(bytes); c.close(); }
      });
      const lector = entrada.pipeThrough(new DecompressionStream(fmt)).getReader();
      const trozos = []; let total = 0;
      for (;;) {
        const {done, value} = await lector.read();
        if (done) break;
        trozos.push(value); total += value.length;
      }
      if (!total) continue;
      const salida = new Uint8Array(total);
      let o = 0;
      for (const t of trozos) { salida.set(t, o); o += t.length; }
      return salida;
    } catch (e) { /* probamos el siguiente formato */ }
  }
  return null;
}

function aTexto(bytes){
  return new TextDecoder("latin1").decode(bytes);
}

/** Saca el texto de los operadores Tj y TJ de un flujo de contenido. */
function textoDeFlujo(s){
  const trozos = [];
  const re = /\((?:\\.|[^\\()])*\)/g;
  let m;
  while ((m = re.exec(s)) !== null) {
    trozos.push(m[0].slice(1,-1)
      .replace(/\\([()\\])/g, "$1")
      .replace(/\\(\d{1,3})/g, (_,o)=>String.fromCharCode(parseInt(o,8))));
  }
  return trozos.join(" ");
}

async function extraerTextoPDF(buffer){
  const bytes = new Uint8Array(buffer);
  const crudo = aTexto(bytes);
  let texto = "";
  let flujos = 0, comprimidos = 0;

  // Ojo: "endstream" contiene "stream". Sin excluirlo, el segundo flujo que
  // se encuentra es basura y la extracción falla sin avisar.
  const re = /(^|[^d])stream\r?\n/g;
  let m;
  while ((m = re.exec(crudo)) !== null) {
    const ini = m.index + m[0].length;
    let fin = crudo.indexOf("endstream", ini);
    if (fin < 0) continue;
    // El salto de línea que precede a "endstream" no es parte de los datos:
    // si se deja, la descompresión falla por basura al final.
    while (fin > ini && (crudo[fin-1] === "\n" || crudo[fin-1] === "\r")) fin--;
    flujos++;
    const cab = crudo.slice(Math.max(0, m.index-400), m.index);
    const datos = bytes.subarray(ini, fin);
    if (/FlateDecode/.test(cab)) {
      comprimidos++;
      const out = await inflar(datos);
      if (out) texto += " " + textoDeFlujo(aTexto(out));
    } else {
      texto += " " + textoDeFlujo(aTexto(datos));
    }
  }
  // Algunos PDF llevan el texto sin comprimir fuera de flujos
  if (texto.trim().length < 20) texto += " " + textoDeFlujo(crudo);
  return {texto: texto.replace(/\s+/g," ").trim(), flujos, comprimidos,
          paginas: (crudo.match(/\/Type\s*\/Page[^s]/g)||[]).length || 1};
}

/** Comprueba qué falta en el texto extraído de un plano. */
function revisarTextoPlano(texto){
  const t = limpiarTxt(texto);
  const hay = {
    tol:    /ISO\s*2768|TOLERANCIA[S]?\s*GENERAL/.test(t),
    ajuste: /\b[HJKNPhjknp][5-9]\b|±\s*0[.,]\d|\+0[.,]\d{2,}/.test(t),
    mat:    MATERIALES.some(([,alias]) => alias.some(a => t.replace(/[\s\-]/g,"").includes(a.replace(/[\s\-]/g,"")))),
    rug:    /\bRA\s*[\d.,]|RUGOSIDAD|\bN\s*[5-9]\b/.test(t),
    trat:   /CROMAD|TEMPLAD|ZINCAD|NITRURAD|CEMENTAD|GALVANIZ|PINTAD|ANODIZ/.test(t),
    rosca:  /\bM\d{1,2}\s*[XX]?\s*[\d.,]*\b|ROSCA/.test(t),
    proy:   /PROYECCION|PROJECTION|DIEDRO|ISO\s*E\b|ISO\s*A\b/.test(t),
    esc:    /ESCALA|SCALE|\b1\s*:\s*\d{1,3}\b/.test(t),
  };
  const faltan = CHECKS_PLANO.filter(c => !hay[c.id]).map(c => c.id);
  return {hay, faltan, legible: t.length > 40};
}

/** Datos que se pueden aprovechar del propio plano. */
function datosDePlano(texto){
  const t = limpiarTxt(texto), d = {};
  for (const [mat, alias] of MATERIALES.map(x=>[x[0],x[1]]))
    if (alias.some(a => t.replace(/[\s\-]/g,"").includes(a.replace(/[\s\-]/g,"")))) { d.material = mat; break; }
  let m;
  if ((m = t.match(/Ø\s*(\d+(?:[.,]\d+)?)\s*[XX*]\s*(\d+(?:[.,]\d+)?)/))) {
    d.diametro = parseFloat(m[1].replace(",",".")); d.longitud = parseFloat(m[2].replace(",","."));
  } else if ((m = t.match(/Ø\s*(\d+(?:[.,]\d+)?)/))) d.diametro = parseFloat(m[1].replace(",","."));
  if ((m = t.match(/\bZ\s*=?\s*(\d{1,3})\b/))) d.z = +m[1];
  if ((m = t.match(/\b([HJKNP][5-9])\b/))) d.tolerancia = m[1];
  return d;
}

/* ---------- STEP ---------- */

function analizarSTEP(texto){
  const r = {tipo:"step", protocolo:null, cad:null, unidad:"mm", solidos:0,
             ensamblaje:false, pmi:[], superficies:{}, envolvente:null, avisos:[]};
  if (!/ISO-10303/.test(texto.slice(0,400))) {
    r.avisos.push("No parece un fichero STEP válido."); return r;
  }
  const cab = texto.split("DATA;")[0] || texto.slice(0,4000);
  const prot = [["MANAGED_MODEL_BASED_3D_ENGINEERING","AP242",
                 "El bueno: admite tolerancias legibles por máquina"],
                ["AUTOMOTIVE_DESIGN","AP214","Geometría y color, sin tolerancias"],
                ["CONFIG_CONTROL_DESIGN","AP203","Solo geometría"]];
  for (const [pat,nom,nota] of prot)
    if (cab.includes(pat)) { r.protocolo = nom; r.nota = nota; break; }

  const cadm = cab.match(/'([^']*(?:SOLIDWORKS|CATIA|INVENTOR|NX|CREO|FUSION|FREECAD|SOLID EDGE)[^']*)'/i);
  if (cadm) r.cad = cadm[1];
  if (/INCH/.test(texto.slice(0,20000))) { r.unidad = "pulgadas"; r.avisos.push("El modelo viene en pulgadas."); }

  for (const [ent,nom] of [["CYLINDRICAL_SURFACE","cilindros"],["PLANE","planos"],
      ["CONICAL_SURFACE","conos"],["TOROIDAL_SURFACE","toros"],
      ["B_SPLINE_SURFACE","superficies libres"]]) {
    const n = (texto.match(new RegExp("=\\s*"+ent+"\\b","g"))||[]).length;
    if (n) r.superficies[nom] = n;
  }
  r.solidos = (texto.match(/=\s*MANIFOLD_SOLID_BREP\b/g)||[]).length;
  const productos = (texto.match(/=\s*PRODUCT\s*\(/g)||[]).length;
  r.ensamblaje = productos > 1 || r.solidos > 1;
  if (r.ensamblaje) r.avisos.push(`El fichero contiene ${Math.max(productos,r.solidos)} piezas. Hace falta un fichero por pieza.`);
  if (/TRIANGULATED_FACE_SET|TESSELLATED_/.test(texto))
    r.avisos.push("Es una malla, no un sólido exacto. No sirve para medir.");

  for (const e of ["DIMENSIONAL_SIZE","GEOMETRIC_TOLERANCE","PLUS_MINUS_TOLERANCE",
                   "DATUM","SURFACE_TEXTURE","CYLINDRICITY_TOLERANCE"])
    if (new RegExp("=\\s*"+e+"\\b").test(texto)) r.pmi.push(e);
  if (!r.pmi.length) r.avisos.push("Sin tolerancias dentro del modelo: habrá que sacarlas del plano.");

  const pts = [...texto.matchAll(/CARTESIAN_POINT\s*\(\s*'[^']*'\s*,\s*\(\s*(-?[\d.E+-]+)\s*,\s*(-?[\d.E+-]+)\s*,\s*(-?[\d.E+-]+)/g)];
  if (pts.length) {
    const f = i => pts.map(p => parseFloat(p[i])).filter(v => !isNaN(v));
    const [xs,ys,zs] = [f(1),f(2),f(3)];
    const k = r.unidad === "pulgadas" ? 25.4 : 1;
    r.envolvente = [ (Math.max(...xs)-Math.min(...xs))*k,
                     (Math.max(...ys)-Math.min(...ys))*k,
                     (Math.max(...zs)-Math.min(...zs))*k ].map(v => +v.toFixed(1));
    r.puntos = pts.length;
  }
  return r;
}

/* ---------- Entrada ---------- */

var ficheros = [];          // {nombre, tipo, resumen}

async function procesarFichero(file){
  const ext = (file.name.split(".").pop()||"").toLowerCase();
  const ent = {nombre:file.name, kb:Math.round(file.size/1024), tipo:ext, estado:"leyendo"};
  ficheros.push(ent); pintar();

  try {
    if (ext === "pdf") {
      const r = await extraerTextoPDF(await file.arrayBuffer());
      const rev = revisarTextoPlano(r.texto);
      ent.tipo = "plano"; ent.estado = "ok";
      ent.pdf = {...r, ...rev, datos: datosDePlano(r.texto)};
      if (!rev.legible) {
        ent.aviso = "Sin capa de texto: es un plano escaneado. Haría falta visión, "
                  + "y la fiabilidad baja mucho.";
      } else {
        // Marca en la lista lo que no aparece en el plano
        peticion.hallazgos = rev.faltan.slice();
        const d = ent.pdf.datos;
        const partes = [];
        if (d.material) partes.push(d.material);
        if (d.diametro) partes.push("Ø"+d.diametro+(d.longitud?"x"+d.longitud:""));
        if (d.z) partes.push("Z"+d.z);
        if (d.tolerancia) partes.push(d.tolerancia);
        if (partes.length) ent.sugerido = partes.join(" ");
      }
    } else if (["step","stp","p21"].includes(ext)) {
      ent.tipo = "3d"; ent.estado = "ok";
      ent.step = analizarSTEP(await file.text());
    } else {
      ent.estado = "no_soportado";
      ent.aviso = "Formato no soportado. Sube un PDF o un STEP.";
    }
  } catch (e) {
    ent.estado = "error";
    ent.aviso = "No se ha podido leer: " + e.message;
  }
  peticion.resultado = null;
  pintar();
}

function quitarFichero(i){ ficheros.splice(i,1); pintar(); }

function engancharZona(){
  const z = document.getElementById("zonaDrop");
  if (!z || z.dataset.listo) return;
  z.dataset.listo = "1";
  const inp = document.getElementById("inpFichero");
  z.addEventListener("dragover", e => { e.preventDefault(); z.classList.add("sobre"); });
  z.addEventListener("dragleave", () => z.classList.remove("sobre"));
  z.addEventListener("drop", e => {
    e.preventDefault(); z.classList.remove("sobre");
    for (const f of e.dataTransfer.files) procesarFichero(f);
  });
  if (inp) inp.addEventListener("change", e => {
    for (const f of e.target.files) procesarFichero(f);
    e.target.value = "";
  });
}

function alternarHallazgo(id){
  const i = peticion.hallazgos.indexOf(id);
  if (i >= 0) peticion.hallazgos.splice(i,1); else peticion.hallazgos.push(id);
  peticion.resultado = null;

function presupuestar(){
  const t = document.getElementById("txtPeticion");
  if (t) peticion.texto = t.value;
  const c = document.getElementById("cantidadMan");
  const mg = document.getElementById("margenMan");
  if (mg) peticion.margen = +mg.value || 35;

  const pieza = normalizarPieza(peticion.texto);
  if (c && +c.value > 0) pieza.cantidad = +c.value;
  const cantidad = pieza.cantidad || 1;

  const hallazgos = CHECKS_PLANO.filter(x => peticion.hallazgos.includes(x.id));
  const sim = buscarSimilares(pieza);
  const ruta = generarRuta(pieza);
  const via = decidirVia(pieza, sim, hallazgos);
  const coste = via.via === "C" ? null : calcularCoste(pieza, ruta, cantidad, peticion.margen);

  // Plazo: días de cola de la máquina más cargada de la ruta + fabricación
  const usadas = ruta.ops.map(o => o.tipo);
  const colaMax = Math.max(0, ...MAQUINAS
    .filter(m => usadas.some(u => m.s.toLowerCase().includes(u.split("_")[0])))
    .map(m => diasDe(m.carga)));
  const externo = ruta.ops.some(o => o.tipo==="externo") ? 9 : 0;
  const optimo = Math.max(1, Math.ceil(colaMax*0.35 + (coste?coste.minutos:0)/480 + externo));
  const comprometible = Math.max(optimo+2, Math.ceil(optimo*1.6));

  peticion.resultado = {pieza, sim, ruta, via, coste, cantidad, hallazgos,
                        optimo, comprometible};
  pintar();
}

};

  "80":25.4,"100":31.75,"120":38.1,"140":44.45,"160":50.8};
const RAMALES_TXT = {1:"simple",2:"doble",3:"triple",4:"cuádruple"};
const TAPER_LOCK = ["1008","1108","1210","1215","1310","1610","1615","2012",
  "2517","3020","3030","3525","3535","4030","4040","4535","4545","5040","5050"];
const NORMAS_T = ["DIN 8187","DIN 8188","DIN 6885","DIN 3961","DIN 3962",
  "ISO 1328","DIN 5480","DIN 5482","ISO 606","DIN 867"];

const TARIFAS = {sierra:0.30, torno_cnc:0.48, torno_paralelo:0.38, fresadora:0.58,
                 centro:0.62, talladora:0.55, mortajadora:0.42, rectificadora:0.55,
                 roscadora:0.35, externo:0};

function limpiarTxt(t){
  return (t||"").toUpperCase()
    .replace(/Ñ/g,"\u0001").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\u0001/g,"Ñ")
    .replace(/[ØøΦ⌀]/g,"Ø").replace(/\bDIAM(?:ETRO)?\.?\s*/g,"Ø")
    .replace(/\s+/g," ");
}

function sacarPaso(t){
  let m = t.match(/\b(0[3-9]|1[0-9]|2[0-8]|3[02]|40|48|100|1[24]0|160)([AB])\s*-?\s*([1-4])?\b/);
  if (m) return {desig:m[1]+m[2], mm:PASOS_MM[m[1]+m[2]]||null, ram:m[3]?+m[3]:null};
  m = t.match(/\b(?:ASA|ANSI)\s*(\d{2,3})\s*-?\s*([1-4])?\b/);
  if (m && PASOS_ANSI[m[1]]) return {desig:"ASA "+m[1], mm:PASOS_ANSI[m[1]], ram:m[2]?+m[2]:null};
  m = t.match(/ISO\s*(\d+)\s*\/\s*(\d+)\s*"/);
  if (m) return {desig:`ISO ${m[1]}/${m[2]}"`, mm:+(+m[1]/+m[2]*25.4).toFixed(3), ram:null};
  m = t.match(/\bPASO\s*[:=]?\s*(\d{1,3}(?:[.,]\d{1,3})?)/);
  if (m) { const v=parseFloat(m[1].replace(",",".")); if(v>=3&&v<=120) return {desig:v+" mm",mm:v,ram:null}; }
  return {desig:null, mm:null, ram:null};
}

function normalizarPieza(texto){
  const t = limpiarTxt(texto), comp = t.replace(/[\s\-_]/g,"");
  const r = {texto, familia:null, material:null, precioKg:null, grupo:null, maq:1,
             z:null, paso:null, pasoMm:null, ramales:null, ramalesTxt:null,
             modulo:null, anguloPresion:null, helicoidal:false, anguloHelice:null,
             sentidoHelice:null, primitivo:null, exterior:null, cubo:null,
             anchoCubo:null, taladro:null, chavetero:null, prisioneros:null,
             taper:null, perfil:null, canales:null, dentadoTemplado:false,
             normas:[], diametro:null, longitud:null, ancho:null, cantidad:null,
             tolerancia:null, tratamientos:[], dudas:[]};

  for (const [f,pistas] of FAMILIAS_T)
    if (pistas.some(x => t.includes(x))) { r.familia = f; break; }
  for (const [m,alias,precio,grupo,maq] of MATERIALES)
    if (alias.some(a => comp.includes(a.replace(/[\s\-]/g,"")))) {
      r.material=m; r.precioKg=precio; r.grupo=grupo; r.maq=maq; break; }

  let m;
  if ((m = t.match(/\bZ\s*=?\s*(\d{1,3})\b/))) { const z=+m[1]; if(z>=5&&z<=250) r.z=z; }
  const pz = sacarPaso(t);
  r.paso = pz.desig; r.pasoMm = pz.mm; r.ramales = pz.ram;
  if (r.ramales) r.ramalesTxt = RAMALES_TXT[r.ramales];

  if ((m = t.match(/\bM[OÓ]D(?:ULO)?\.?\s*[:=]?\s*(\d{1,2}(?:[.,]\d{1,2})?)\b/)) ||
      (m = t.match(/\bM\s*=\s*(\d{1,2}(?:[.,]\d{1,2})?)\b/))) {
    const v = parseFloat(m[1].replace(",",".")); if (v>=0.3 && v<=40) r.modulo = v;
  }

  // Cotas con etiqueta: se sacan antes que las generales
  const marca = (re) => { const x = t.match(re); return x ? parseFloat(x[1].replace(",",".")) : null; };
  r.primitivo = marca(/(?:Ø\s*)?PRIM(?:ITIVO)?\.?\s*[:=]?\s*Ø?\s*(\d{1,4}(?:[.,]\d{1,2})?)/);
  r.exterior  = marca(/(?:Ø\s*)?EXT(?:ERIOR)?\.?\s*[:=]?\s*Ø?\s*(\d{1,4}(?:[.,]\d{1,2})?)/);
  r.cubo      = marca(/(?:Ø\s*)?CUBO\s*[:=]?\s*Ø?\s*(\d{1,4}(?:[.,]\d{1,2})?)/);
  r.anchoCubo = marca(/ANCHO\s*(?:DE\s*)?CUBO\s*[:=]?\s*(\d{1,4}(?:[.,]\d{1,2})?)/);
  r.taladro   = marca(/(?:TALADRO|Ø\s*INT(?:ERIOR)?|AGUJERO)\s*[:=]?\s*Ø?\s*(\d{1,4}(?:[.,]\d{1,2})?)/);

  if ((m = t.match(/CHAV(?:ETERO|ETA)?\.?\s*[:=]?\s*(\d{1,2}\s*[XX*]\s*\d{1,2}(?:[.,]\d)?)/)))
    r.chavetero = m[1].replace(/\s*[XX*]\s*/,"x").replace(",",".");
  else if (/\bCHAVETERO\b|\bDIN\s*6885\b/.test(t)) r.chavetero = "sí, sin medida";
  if ((m = t.match(/(\d)\s*PRISIONERO/))) r.prisioneros = +m[1];
  else if (t.includes("PRISIONERO")) r.prisioneros = 1;

  if (/TAPER|CASQUILLO C[OÓ]NICO|BUJ[EÉ] C[OÓ]NICO/.test(t))
    for (const x of t.match(/\b\d{4}\b/g)||[]) if (TAPER_LOCK.includes(x)) { r.taper=x; break; }

  if (/HELICOIDAL|H[EÉ]LICE/.test(t)) {
    r.helicoidal = true;
    if ((m = t.match(/(?:H[EÉ]LICE|BETA|β)\s*[:=]?\s*(\d{1,2}(?:[.,]\d{1,2})?)\s*°?/)))
      r.anguloHelice = parseFloat(m[1].replace(",","."));
    if (/\bDCHA|DERECHA|\bRH\b/.test(t)) r.sentidoHelice = "derecha";
    else if (/\bIZDA|IZQUIERDA|\bLH\b/.test(t)) r.sentidoHelice = "izquierda";
  }
  if ((m = t.match(/(?:[AÁ]NGULO\s*(?:DE)?\s*PRESI[OÓ]N|ALPHA|α)\s*[:=]?\s*(\d{2}(?:[.,]\d)?)/)))
    r.anguloPresion = parseFloat(m[1].replace(",","."));
  else if ((r.modulo || r.z) && (m = t.match(/\b(14[.,]5|20|25)\s*°/)))
    r.anguloPresion = parseFloat(m[1].replace(",","."));

  let pasoCorrea = null;
  if ((m = t.match(/\b(?:HTD|STD)\s*(\d{1,2})\s*M\b/))) { r.perfil="HTD "+m[1]+"M"; pasoCorrea=+m[1]; }
  else if ((m = t.match(/\b(SPZ|SPA|SPB|SPC|XPZ|XPA|XPB|XPC|AT(?:5|10|20)|T(?:2[.,]5|5|10|20))\b/))) {
    r.perfil = m[1].replace(",","."); 
    const q = r.perfil.match(/A?T(\d+(?:\.\d)?)/); if (q) pasoCorrea = +q[1];
  }
  if ((m = t.match(/(\d{1,2})\s*(?:CANALES?|GARGANTAS?|RANURAS?)/))) r.canales = +m[1];
  r.dentadoTemplado = /DENTADO\s+(?:TEMPLADO|CEMENTADO|NITRURADO)|TEMPLE\s+DE\s+(?:DIENTES|DENTADO)/.test(t);
  r.normas = NORMAS_T.filter(n => t.replace(/\s/g,"").includes(n.replace(/\s/g,"")));

  // Dimensiones generales, sobre el texto sin las cotas etiquetadas
  const residuo = t.replace(
    /(?:CHAV(?:ETERO|ETA)?\.?\s*[:=]?\s*\d{1,2}\s*[XX*]\s*\d{1,2}(?:[.,]\d)?)|(?:(?:Ø\s*)?(?:PRIM(?:ITIVO)?|EXT(?:ERIOR)?|CUBO|TALADRO|AGUJERO|Ø\s*INT(?:ERIOR)?)\.?\s*[:=]?\s*Ø?\s*\d{1,4}(?:[.,]\d{1,2})?)|(?:ANCHO\s*(?:DE\s*)?CUBO\s*[:=]?\s*\d{1,4}(?:[.,]\d{1,2})?)/g, " ");
  if ((m = residuo.match(/Ø\s*(\d+(?:[.,]\d+)?)\s*[XX*]\s*(\d+(?:[.,]\d+)?)/))) {
    r.diametro = parseFloat(m[1].replace(",",".")); r.longitud = parseFloat(m[2].replace(",","."));
  } else if ((m = residuo.match(/Ø\s*(\d+(?:[.,]\d+)?)/)))
    r.diametro = parseFloat(m[1].replace(",","."));
  if ((m = t.match(/\bANCHO\s*(?:TOTAL)?\s*[:=]?\s*(\d{1,4}(?:[.,]\d{1,2})?)\b/)) &&
      !/CUBO/.test(t.slice(Math.max(0,m.index-12), m.index)))
    r.ancho = parseFloat(m[1].replace(",","."));

  for (const p of [/\bCANT(?:IDAD)?\.?\s*[:=]?\s*(\d{1,5})\b/,
                   /\b(\d{1,5})\s*(?:UDS?|UNID(?:ADES)?|PZAS?|PIEZAS?|PCS?)\b/,
                   /\bN[ºO°]\s*(?:DE\s*)?(?:UDS?|PIEZAS?)\s*[:=]?\s*(\d{1,5})\b/]) {
    const x = t.match(p); if (x) { r.cantidad = +x[1]; break; }
  }
  if ((m = t.match(/\b([HJKNP][5-9])\b|\bIT\s*([5-9])\b|±\s*0[.,](\d+)/))) r.tolerancia = m[0];
  for (const [tr,pistas] of [["cromado",["CROMAD"]],["templado",["TEMPLAD","TEMPLE","BONIFICAD"]],
      ["cementado",["CEMENTAD"]],["zincado",["ZINCAD","CINCAD","GALVANIZ"]],
      ["nitrurado",["NITRURAD"]]])
    if (pistas.some(x => t.includes(x))) r.tratamientos.push(tr);

  // Geometría deducida
  if (r.z && !r.primitivo) {
    if (r.pasoMm)      r.primitivo = +(r.pasoMm/Math.sin(Math.PI/r.z)).toFixed(2);
    else if (r.modulo) r.primitivo = +(r.modulo*r.z).toFixed(2);
    else if (pasoCorrea) r.primitivo = +(pasoCorrea*r.z/Math.PI).toFixed(2);
  }
  if (r.z && !r.exterior) {
    if (r.pasoMm)      r.exterior = +(r.pasoMm*(0.6+1/Math.tan(Math.PI/r.z))).toFixed(2);
    else if (r.modulo) r.exterior = +(r.modulo*(r.z+2)).toFixed(2);
  }
  if (r.z && r.exterior) r.diametro = r.exterior;

  if (!r.familia)  r.dudas.push("No reconozco la familia de la pieza");
  if (!r.material) r.dudas.push("Sin material identificable");
  if (!r.cantidad) r.dudas.push("Sin cantidad");
  if (["pinon","pinon_doble","corona"].includes(r.familia) && !r.z)
    r.dudas.push("Pieza dentada sin número de dientes");
  if (r.z && !r.pasoMm && !r.modulo)
    r.dudas.push("Dentado sin paso ni módulo: no se puede calcular la geometría");
  if (["pinon","pinon_doble"].includes(r.familia) && r.ramales===null && r.paso)
    r.dudas.push("No indica si es simple, doble o triple");
  if (["pinon","pinon_doble","corona","polea"].includes(r.familia) && !r.taladro && !r.taper)
    r.dudas.push("Sin diámetro de taladro ni casquillo cónico");
  if (r.familia==="polea" && !r.perfil) r.dudas.push("Polea sin perfil de correa");
  if (["eje","casquillo"].includes(r.familia) && !r.diametro)
    r.dudas.push("Pieza de revolución sin diámetro");
  return r;
}

function parecido(a, b){
  if (!a.familia || a.familia !== b.fam) {
    const vecinas = [["pinon","pinon_doble"],["eje","casquillo"]];
    if (!vecinas.some(g => g.includes(a.familia) && g.includes(b.fam))) return 0;
  }
  let pts = 0, peso = 0, motivos = [];
  const suma = (p, v, txt) => { peso += p; pts += p*v; if (txt) motivos.push(txt); };

  if (a.material && b.mat) {
    const ga = (MATERIALES.find(m=>m[0]===a.material)||[])[3];
    const gb = (MATERIALES.find(m=>m[0]===b.mat)||[])[3];
    const v = a.material===b.mat ? 1 : (ga && ga===gb ? 0.55 : 0.15);
    suma(0.30, v, a.material===b.mat ? "mismo material"
       : `material distinto (${a.material} / ${b.mat})`);
  }
  if (a.z && b.z) {
    const v = Math.max(0, 1 - Math.abs(a.z-b.z)/Math.max(a.z,b.z)/0.35);
    suma(0.28, v, a.z===b.z ? "mismo número de dientes" : `Z ${a.z} frente a ${b.z}`);
  }
  if (a.pasoMm && b.paso) {
    const v = Math.abs(a.pasoMm-b.paso) < 0.2 ? 1 : 0;
    suma(0.22, v, v ? "mismo paso de cadena" : "paso de cadena distinto");
  }
  if (a.modulo && b.modulo) {
    // Dos coronas con el mismo Z y distinto módulo no son la misma pieza:
    // cambian el diámetro, la fresa madre y el tiempo de tallado.
    const dif = Math.abs(a.modulo-b.modulo)/Math.max(a.modulo,b.modulo);
    suma(0.22, Math.max(0, 1-dif/0.25),
      dif < 0.02 ? "mismo módulo" : `módulo distinto (${a.modulo} / ${b.modulo})`);
  }
  if (a.ramales && b.ramales) {
    const v = a.ramales===b.ramales ? 1 : 0.2;
    suma(0.12, v, v===1 ? null : `ramales distintos (${a.ramales} / ${b.ramales})`);
  }
  if (a.diametro && b.diam) {
    const dif = Math.abs(a.diametro-b.diam)/Math.max(a.diametro,b.diam);
    suma(0.20, Math.max(0,1-dif/0.40),
      dif<0.02 ? "mismo diámetro" : `diámetro ${Math.round(dif*100)}% distinto`);
  }
  if (a.longitud && b.lon) {
    const dif = Math.abs(a.longitud-b.lon)/Math.max(a.longitud,b.lon);
    suma(0.10, Math.max(0,1-dif/0.60), null);
  }
  if (!peso) return 0;
  return {s:+(pts/peso).toFixed(3), motivos};
}

function buscarSimilares(p){
  return HISTORICO.map(x => ({...x, ...(parecido(p,x)||{s:0,motivos:[]})}))
    .filter(x => x.s >= 0.55).sort((a,b)=>b.s-a.s).slice(0,5);
}

function generarRuta(p){
  const ops = [], add = (tipo,desc,min,nota) =>
    ops.push({tipo, desc, min:+min.toFixed(2), prep:PREP[tipo], nota:nota||""});
  const maq = p.maq || 1, d = p.diametro, L = p.longitud || (d ? d*1.2 : null);
  if (!p.familia || (!d && !p.z)) return {ops:[], avisos:["Faltan datos para generar la ruta"]};

  const bruto = d ? d*1.08+4 : null;
  if (bruto) add("sierra", `Tronzar redondo Ø${bruto.toFixed(0)}`,
                 Math.PI*Math.pow(bruto/20,2)/(22*Math.min(1.6,maq)) + 0.5);
  if (d) {
    const rev = (vc,dm) => 1000*vc/(Math.PI*dm);
    const vc = 200*maq, av = 0.35;
    let min = 0, dm = bruto, pasadas = Math.max(1, Math.ceil((bruto-d)/2/4));
    for (let i=0;i<pasadas;i++){ dm = Math.max(d, dm-8); min += L/(av*rev(vc,Math.max(dm,1))); }
    add("torno_cnc", `Torneado desbaste Ø${bruto.toFixed(0)} → Ø${d.toFixed(0)}`, min);
    add("torno_cnc", "Torneado de acabado", L/(0.15*rev(260*maq,d)) + d/2/(0.15*rev(260*maq,d/2)));
  }
  if (["pinon","pinon_doble","corona"].includes(p.familia) && p.z) {
    const modulo = p.modulo || (p.pasoMm ? p.pasoMm/Math.PI : (d ? d/(p.z+2) : 3));
    const ancho = p.ancho || Math.max(8, (d||60)*0.2);
    const dFresa = Math.max(70, 20*modulo);
    const nFresa = 1000*(200*maq*0.30)/(Math.PI*dFresa);
    let t = p.z*(ancho+2.5*modulo)/(1.8*Math.min(1.3,maq)*nFresa);
    if (p.familia==="pinon_doble" || (p.ramales||1) > 1) t *= (p.ramales||2);
    add("talladora", `Tallado Z${p.z}, módulo ${modulo.toFixed(2)}`, t,
        "El tiempo crece con el número de dientes, no con el diámetro");
    add("mortajadora", "Chavetero interior", Math.max(6, (L||40)*0.08));
  }
  for (const tr of p.tratamientos)
    add("externo", `${tr[0].toUpperCase()+tr.slice(1)} (subcontrata)`, 0,
        "Plazo externo de 8 a 10 días");
  if (p.tolerancia && /H[67]|IT\s*[567]/.test(p.tolerancia) && d)
    add("rectificadora", "Rectificado cilíndrico",
        Math.PI*d*(L||d)*0.2/1800 + 3, `Tolerancia ${p.tolerancia}: no se alcanza torneando`);
  return {ops, avisos:[]};
}

function calcularCoste(p, ruta, cantidad, margenPct){
  const kg = p.diametro && p.longitud
    ? Math.PI*Math.pow(p.diametro/20+0.2,2)*(p.longitud/10)/1000*7.85
    : (p.diametro ? Math.PI*Math.pow(p.diametro/20,2)*(p.diametro/10)/1000*7.85 : 0.5);
  const material = kg*cantidad*(p.precioKg||2.40)*1.10;
  let maquina = 0, prep = 0, externo = 0, minutos = 0;
  for (const o of ruta.ops) {
    if (o.tipo === "externo") { externo += 1.2*cantidad; continue; }
    maquina += o.min*cantidad*TARIFAS[o.tipo];
    prep    += o.prep*TARIFAS[o.tipo];
    minutos += o.min*cantidad + o.prep;
  }
  const sub = material+maquina+prep+externo;
  const indirectos = sub*0.10, coste = sub+indirectos;
  const precio = coste*(1+margenPct/100);
  return {kg:+kg.toFixed(3), material:+material.toFixed(2), maquina:+maquina.toFixed(2),
          prep:+prep.toFixed(2), externo:+externo.toFixed(2),
          indirectos:+indirectos.toFixed(2), coste:+coste.toFixed(2),
          precio:+precio.toFixed(2), unitario:+(precio/cantidad).toFixed(2),
          minutos:Math.round(minutos)};
}

function decidirVia(p, sim, hallazgos){
  const bloq = hallazgos.filter(h=>h.g==="bloqueante").length;
  if (p.dudas.length >= 3 || bloq >= 2) return {via:"C", conf:0.20};
  if (!sim.length) return {via:"C", conf:0.25};
  const mejor = sim[0].s, apoyo = Math.min(1, sim.length/3);
  if (mejor >= 0.93 && !bloq) return {via:"A", conf:+Math.min(0.95, 0.80+0.15*apoyo).toFixed(2)};
  if (mejor >= 0.70) return {via:"B", conf:+(0.45+0.30*mejor*apoyo).toFixed(2)};
  return {via:"C", conf:+(0.20+0.20*mejor).toFixed(2)};
}

   Las dos naves en su posición real, separadas por la carretera.
   La izquierda sale de la foto aérea: rectángulo girado 45°, proporción 1,31.
   La derecha está cortada en la foto, así que su tamaño es estimado.
   ============================================================ */

const G = Math.SQRT1_2;                 // las naves están giradas 45°
const UX = [ G, -G];                    // eje "ancho"  (hacia arriba-derecha)
const UY = [ G,  G];                    // eje "largo"  (hacia abajo-derecha)

      medidasEstimadas:true,

  2: {nombre:"Nave 2 — Fresado, dentado y corte", origen:[52, 26], ancho:52, largo:70,
      medidasEstimadas:true,
      forma:[[0,10],[14,0],[52,0],[52,70],[6,70]]},
};

/* De coordenadas locales de una nave (metros) a la lona común */
function aLona(nv, x, y) {
  const o = NAVES[nv].origen;
  return [o[0] + x*UX[0] + y*UY[0], o[1] + x*UX[1] + y*UY[1]];
}

function ordenesDe(m) {
  /* Deterministas a partir del código: la misma máquina da siempre lo mismo */
  let semilla = [...m.c].reduce((s, ch) => s + ch.charCodeAt(0), 0);
  const sig = () => (semilla = (semilla * 9301 + 49297) % 233280) / 233280;
  const n = m.carga === 0 ? 0 : 2 + Math.floor(sig() * 9);
  return Array.from({length:n}, () => ({
    num: 164000 + Math.floor(sig() * 2500),
    cliente: CLIENTES_ORD[Math.floor(sig() * CLIENTES_ORD.length)],
    uds: 1 + Math.floor(sig() * 30),
    minutos: 60 + Math.floor(sig() * 900),
  }));
}

function duracion(min) {
  if (!min) return "sin carga";
  const d = Math.floor(min / (60*8)), r = min % (60*8);
  const hh = Math.floor(r / 60), mm = Math.round(r % 60);
  return `${d} d ${hh} h ${mm} min`;
}
const diasDe = min => +(min / (60*8)).toFixed(1);

var modoMapa = "estado";
var maquinaSel = null;

function colorMaquina(m) {
  if (modoMapa === "estado") return ESTADOS[m.e].c;
  const d = diasDe(m.carga);
  if (!d) return "#C4C7C9";
  if (d > 15) return "#D42A2A";
  if (d > 8)  return "#D9A441";
  if (d > 3)  return "#6B7280";
  return "#16A34A";
}

function dibujarPlanta() {
  const ESC = 7.6;                       // píxeles por metro
  const pt = (nv,x,y) => aLona(nv,x,y).map(v => +(v*ESC).toFixed(1));

  /* Extensión de la lona */
  let minx=1e9, miny=1e9, maxx=-1e9, maxy=-1e9;
  for (const nv of [1,2]) for (const [x,y] of NAVES[nv].forma) {
    const [px,py] = pt(nv,x,y);
    minx=Math.min(minx,px); maxx=Math.max(maxx,px);
    miny=Math.min(miny,py); maxy=Math.max(maxy,py);
  }
  const pad = 26, W = maxx-minx+pad*2, H = maxy-miny+pad*2;
  const tr = ([x,y]) => `${(x-minx+pad).toFixed(1)},${(y-miny+pad).toFixed(1)}`;

  const contorno = nv => NAVES[nv].forma.map(([x,y]) => tr(pt(nv,x,y))).join(" ");

  /* Carretera: la franja entre el lado este de la nave 1 y el oeste de la nave 2 */
  const carretera = [ pt(1,37,0), pt(2,14,0), pt(2,0,10), pt(2,0,70), pt(1,37,48) ]
    .map(tr).join(" ");

  const zonas = ZONAS.map(z => {
    const c = [[z.x,z.y],[z.x+z.w,z.y],[z.x+z.w,z.y+z.l],[z.x,z.y+z.l]]
      .map(([x,y]) => tr(pt(z.nv,x,y))).join(" ");
    const [cx,cy] = pt(z.nv, z.x+z.w/2, z.y+z.l/2);
    return `<polygon points="${c}" fill="${z.tipo==="acceso"?"#FDECEC":"#F2F1EE"}"
      stroke="#DDE0E3" stroke-dasharray="5 4"/>
      <text x="${(cx-minx+pad).toFixed(1)}" y="${(cy-miny+pad+4).toFixed(1)}"
        text-anchor="middle" font-size="10.5" fill="#8A9097">${esc2(z.t)}</text>`;
  }).join("");

  const maquinas = MAQUINAS.map(m => {
    const c = [[m.x,m.y],[m.x+m.w,m.y],[m.x+m.w,m.y+m.l],[m.x,m.y+m.l]]
      .map(([x,y]) => tr(pt(m.nv,x,y))).join(" ");
    const [cx,cy] = pt(m.nv, m.x+m.w/2, m.y+m.l/2);
    const sel = maquinaSel === m.c;
    return `<g class="mq" onclick="maquinaSel='${m.c}';pintar()">
      <polygon points="${c}" fill="${colorMaquina(m)}"
        stroke="${sel ? "#14171A" : "rgba(0,0,0,.18)"}" stroke-width="${sel ? 2.5 : 1}"/>
      <text x="${(cx-minx+pad).toFixed(1)}" y="${(cy-miny+pad+3.5).toFixed(1)}"
        text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff"
        style="pointer-events:none">${esc2(m.c)}</text>
      <title>${esc2(m.n)} — ${ESTADOS[m.e].t} — ${duracion(m.carga)} de cola</title>
    </g>`;
  }).join("");

  const etiquetas = [1,2].map(nv => {
    const [cx,cy] = pt(nv, NAVES[nv].ancho/2, -4);
    return `<text x="${(cx-minx+pad).toFixed(1)}" y="${(cy-miny+pad).toFixed(1)}"
      text-anchor="middle" font-size="12.5" font-weight="600" fill="#14171A"
      >${esc2(NAVES[nv].nombre)}</text>`;
  }).join("");

  return `<svg viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}" width="100%"
    style="display:block;background:#fff;border:1px solid var(--borde);border-radius:10px">
    <polygon points="${carretera}" fill="#EDEEF0"/>
    <polygon points="${contorno(1)}" fill="#FBFBFC" stroke="#14171A" stroke-width="2.2"/>
    <polygon points="${contorno(2)}" fill="#FBFBFC" stroke="#14171A" stroke-width="2.2"/>
    ${zonas}${maquinas}${etiquetas}</svg>`;
}

                <span class="cifra" style="font-weight:500">${o.num}</span>
                <span class="sub"> — ${esc(o.cliente)}</span>
                <div class="sub" style="font-size:11.5px">${o.uds} uds ·
                  ${duracion(o.minutos)}</div>
              </div>`).join("")
              : `<div class="sub" style="padding:12px">Nada en espera.</div>`}
          </div>

          <p class="nota" style="margin-top:12px">Datos de ejemplo. Con el ERP conectado,
          esto es lo que devuelve Control de Rutas por Máquina.</p>
        </div>` : `
        <div class="tarjeta" style="margin-bottom:14px">
          <h3>Pulsa una máquina</h3>
          <div class="sub2">Verás la orden en curso, la carga de trabajo y la lista
            de espera, como en el ERP.</div>
        </div>`}

        <div class="tarjeta">
          <h3>Las seis más cargadas</h3>
          <div class="sub2">Días de trabajo pendiente</div>
          ${gBarrasH(saturadas.slice(0,6).map(m => ({e:m.c+" "+m.n.split(" ")[0],
            v:diasDe(m.carga), color:colorMaquina(m)})), {formato: v => v + " d"})}
        </div>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   VISTA: ASISTENTE
   ============================================================ */
var conversacion = [
  {de:"bot", txt:"Puedo consultar los datos de la empresa o resolver dudas técnicas "+
   "de mecanizado. Si no sé algo, te lo diré en vez de inventarlo."}
];

const SUGERENCIAS = [
  "¿Cuántas ofertas le hemos hecho a YUK?",
  "¿Cómo vamos respecto a otros años?",
  "¿Qué tal convertimos con Chains & Sprockets?",
  "¿Qué significa ISO 2768-m?",
  "¿A cuánto vendemos el piñón Z18?",
  "¿Qué taladro lleva una M8?",
];

function vistaAsistente() {
  return `
  <div class="cabecera">
    <div><h1>Asistente</h1>
      <p>Pregunta por los datos de la empresa o por dudas técnicas</p></div>
  </div>
  <div style="padding:0 24px 16px">
    <div class="sug">
      ${SUGERENCIAS.map(s => `<button onclick="preguntar('${s.replace(/'/g,"\\'")}')">${esc(s)}</button>`).join("")}
    </div>
    <div class="chat">
      <div class="msgs" id="msgs">
        ${conversacion.map(m => {
          if (m.de === "yo") return `<div class="burb yo">${esc(m.txt)}</div>`;
          const fuente = m.carril === "datos"
            ? `<div class="fuente">Base de datos de Luanfra</div>`
            : m.carril === "tecnico"
            ? `<div class="fuente tec">Conocimiento técnico general, NO datos de Luanfra</div>`
            : "";
          const filas = m.filas ? `<table style="margin-top:10px;font-size:13px">
            ${m.filas.map(f=>`<tr><td style="padding:5px 10px">${esc(f[0])}</td>
              <td class="der cifra" style="padding:5px 10px;font-weight:500">${esc(f[1])}</td></tr>`).join("")}
            </table>` : "";
          return `<div class="burb bot">${esc(m.txt)}${filas}${fuente}</div>`;
        }).join("")}
      </div>
      <div class="entrada">
        <input class="campo" id="pregunta" placeholder="Escribe tu pregunta…"
          onkeydown="if(event.key==='Enter')preguntar(this.value)">
        <button class="btn btn-prim" onclick="preguntar(document.getElementById('pregunta').value)">
          Enviar</button>
      </div>
    </div>
    <p class="nota" style="margin-top:12px">
      El asistente no escribe SQL: elige entre consultas ya preparadas. Un modelo que
      se equivoca en una consulta no da un error, da un número plausible y falso.</p>
  </div>`;
}

function preguntar(texto) {
  texto = (texto || "").trim();
  if (!texto) return;
  conversacion.push({de:"yo", txt:texto});

  const r = RESPUESTAS.find(x => x.p.test(texto));
  if (r) {
    conversacion.push({de:"bot", txt:r.t, carril:r.carril, filas:r.filas});
  } else {
    conversacion.push({de:"bot", carril:"no_se",
      txt:"No sé responder a eso con los datos que tengo. Prueba con alguna de las "+
          "sugerencias de arriba: puedo consultar ofertas por cliente, evolución por "+
          "año, precios de una pieza y carga del taller."});
  }
  pintar();
  const m = document.getElementById("msgs");
  if (m) m.scrollTop = m.scrollHeight;
}

/* ============================================================
   ACCIONES
   ============================================================ */
function alternarCorreccion() {
  const f = document.getElementById("formCorreccion");
  f.style.display = f.style.display === "none" ? "block" : "none";
  if (f.style.display === "block") document.getElementById("nuevoPrecio").focus();
}

function validarPrecio(id) {
  const o = OFERTAS.find(x => x.id === id);
  const v = parseFloat(document.getElementById("nuevoPrecio").value);
  const err = document.getElementById("errPrecio");
  const btn = document.getElementById("btnGuardar");
  if (isNaN(v)) { err.style.display="none"; btn.disabled = true; return false; }
  if (o.coste != null && v < o.coste) {
    err.textContent = `No puede quedar por debajo del coste (${eur(o.coste)}).`;
    err.style.display = "block"; btn.disabled = true; return false;
  }
  err.style.display = "none"; btn.disabled = false; return true;
}

function corregir(id) {
  if (!validarPrecio(id)) { brindis("Revisa el precio antes de guardar.", false); return; }
  const o = OFERTAS.find(x => x.id === id);
  const nuevo = parseFloat(document.getElementById("nuevoPrecio").value);
  const motivo = document.getElementById("motivo").value.trim();
  o.correcciones.unshift({ antes:o.precio, despues:nuevo, motivo });
  o.precio = nuevo;
  const amp = (1 - o.confianza) * 0.30;
  o.min = +(nuevo * (1-amp)).toFixed(2);
  o.max = +(nuevo * (1+amp)).toFixed(2);
  brindis("Corrección guardada.");
  pintar();
}

function aprobar(id) {
  const o = OFERTAS.find(x => x.id === id);
  if (o.precio == null) { brindis("Esta oferta no tiene precio propuesto. Corrígela antes.", false); return; }
  o.estado = "revisada";
  brindis("Oferta marcada como revisada. No se ha enviado nada.");
  pintar();
}

function descartar(id) {
  const o = OFERTAS.find(x => x.id === id);
  o.estado = "descartada";
  brindis("Oferta descartada.");
  irA("ofertas");
}

function simular() {
  const cod = document.getElementById("simCentro").value;
  const cant = parseInt(document.getElementById("simCantidad").value, 10);
  const mpp  = parseFloat(document.getElementById("simMinutos").value);
  const salida = document.getElementById("simResultado");
  if (isNaN(cant) || isNaN(mpp) || cant < 1 || mpp <= 0) {
    salida.innerHTML = `<p class="nota" style="color:var(--marca)">Introduce una cantidad y un tiempo válidos.</p>`;
    return;
  }
  const c = CENTROS.find(x => x.cod === cod);
  const minDia = c.horas * 60 * c.factor;
  const nuevos = cant * mpp;
  const antes = c.cola / minDia;
  const despues = (c.cola + nuevos) / minDia;
  const optimo = Math.max(1, Math.ceil(despues));
  const comprometible = Math.max(optimo + 1, Math.ceil(optimo * 1.6));
  const afectadas = OFERTAS.filter(o => o.estado === "borrador" && o.precio != null).slice(0,3);

  salida.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px">
      <div class="kpi"><div class="etiqueta">Carga añadida</div>
        <div class="valor cifra">${horas(Math.round(nuevos))}</div></div>
      <div class="kpi"><div class="etiqueta">Cola antes → después</div>
        <div class="valor cifra">${antes.toFixed(1)} → ${despues.toFixed(1)} d</div></div>
      <div class="kpi"><div class="etiqueta">Se retrasa</div>
        <div class="valor cifra acento">+${(despues-antes).toFixed(1)} días</div></div>
    </div>
    <div class="aviso ${despues-antes > 5 ? "bloqueante" : despues-antes > 2 ? "importante" : "menor"}">
      <span class="ic">${despues-antes > 2 ? "!" : "i"}</span>
      <span>Fecha óptima <strong>${optimo} días</strong>, comprometible <strong>${comprometible} días</strong>.
      ${despues-antes > 2
        ? `Todo lo que pase por ${cod} se desplaza. Con ${afectadas.length} ofertas abiertas en cola,
           conviene avisar antes de aceptar.`
        : `Impacto pequeño. Se puede aceptar sin mover nada.`}</span>
    </div>`;
}

/* ============================================================
   ARRANQUE
   ============================================================ */
function pintar() {
  pintarLateral();
  const v = document.getElementById("vista");
  const p = ruta.pantalla;
  v.innerHTML =
      p === "panel"     ? vistaPanel()
    : p === "peticion"  ? vistaPeticion()
    : p === "avisos"    ? vistaAvisos()
    : p === "kpis"      ? vistaKpis()
    : p === "asistente" ? vistaAsistente()
    : p === "mapa"      ? vistaMapa()
    : p === "ofertas"  ? vistaOfertas()
    : p === "ficha"    ? vistaFicha(ruta.id)
    : p === "planos"   ? vistaPlanos()
    : p === "taller"   ? vistaTaller()
    : p === "clientes" ? vistaClientes()
    : p === "ajustes"  ? vistaAjustes()
    : vistaPanel();
  if (p === "taller") simular();
  if (p === "peticion") engancharZona();
}

pintar();
</script>
